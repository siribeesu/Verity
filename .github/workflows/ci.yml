name: Continuous Integration & Verification

on:
  push:
    branches: [ main, master, update ]
  pull_request:
    branches: [ main, master, update ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix client

      - name: Security Vulnerability Audit
        run: |
          npm audit --audit-level=critical
          npm audit --prefix server --audit-level=critical
          npm audit --prefix client --audit-level=critical

      - name: Run Server Test Suites (44 Tests)
        run: npm test --prefix server
        env:
          NODE_ENV: test
          PROVIDER: gemini
          GEMINI_API_KEY: mock-test-key-for-ci

      - name: Run Client Test Suites (28 Tests)
        run: npm test --prefix client

      - name: Verify Client Production Build (Vite)
        run: npm run build --prefix client
